<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Game on Study</title>
<link rel="icon" type="images/png" href="images/logo1.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
/* GLOBAL STYLES */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
#mainTitle {
    color: #00ffff;
  text-shadow: 
    0 0 5px #f50aa7,
    0 0 10px #ff9900,
    0 0 20px #2600ff;
    font-size: 70px;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  background: linear-gradient(135deg, #04193F 0%, #032B71 50%, #040E2B 100%);
}

/* Background Slideshow Container */
.background-slideshow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: #000;
}

.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 2s ease-in-out;
}

.slide.active {
  opacity: 1;
  z-index: 1;
}

/* Season indicator */
.season-indicator {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(0, 0, 0, 0.5);
  padding: 5px 15px;
  border-radius: 20px;
  font-size: 14px;
  color: #FFD700;
  z-index: 1000;
  border: 1px solid rgba(255,255,255,0.3);
  backdrop-filter: blur(5px);
}

/* Tamil font support */
@font-face {
  font-family: 'TamilFont';
  src: url('https://cdn.jsdelivr.net/npm/tamil-fonts@1.0.0/Latha.ttf');
}

.tamil-text, .tamil-message, .tamil-question {
  font-family: 'TamilFont', 'Segoe UI', 'Noto Sans Tamil', sans-serif;
  font-size: 16px;
  line-height: 1.8;
}

/* Score Display */
.score-display {
  position: fixed;
  top: 20px;
  right: 20px;
  background: linear-gradient(135deg, rgba(248, 201, 50, 0.95), rgba(255, 222, 115, 0.95));
  padding: 12px 24px;
  border-radius: 15px;
  font-weight: bold;
  z-index: 1000;
  border: 2px solid #FFD700;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
  font-size: 18px;
  backdrop-filter: blur(5px);
}

/* LANGUAGE TOGGLE BUTTON */
#languageToggle {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 12px 24px;
  background: linear-gradient(135deg, rgba(79, 172, 254, 0.9), rgba(0, 242, 254, 0.9));
  color: white;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  font-weight: bold;
  z-index: 1000;
  min-width: auto;
  transition: all 0.3s ease;
  border: 2px solid white;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
}

#languageToggle:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
}

/* REFRESH BUTTON */
.refresh-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 24px;
  background: linear-gradient(135deg, rgba(255, 107, 107, 0.9), rgba(238, 90, 82, 0.9));
  color: white;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  font-weight: bold;
  z-index: 1000;
  border: 2px solid white;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
  transition: all 0.3s ease;
}

.refresh-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
}

/* UTILITY CLASSES */
.hidden { display: none !important; }
.text-center { text-align: center; }

/* HEADER & TITLE */
h1 {
  font-size: 2.8rem;
  margin: 30px 0;
  text-align: center;
  background: linear-gradient(135deg, #640b1775, #ffffff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 2px 2px 4px rgb(250, 250, 250);
  padding-top: 60px;
}

h2 {
  font-size: 1.8rem;
  margin: 20px 0;
  color: #4facfe;
  text-align: center;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

/* SECTION STYLES */
.section {
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  border-radius: 24px;
  padding: 30px;
  margin: 20px auto;
  max-width: 900px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  border: 2px solid rgba(255, 255, 255, 0.2);
  transition: transform 0.3s ease;
}

.section:hover {
  transform: translateY(-5px);
  border-color: #4facfe;
}

/* BUTTONS */
button {
  padding: 14px 24px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  transition: all 0.3s ease;
  margin: 8px;
  min-width: 160px;
  border: 2px solid white;
  box-shadow: 0 5px 10px rgba(0,0,0,0.3);
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.continue-btn {
  background: linear-gradient(135deg, #43e97b, #38f9d7) !important;
  margin-top: 20px;
  font-size: 18px;
  padding: 15px 30px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.locked {
  opacity: 0.6;
  cursor: not-allowed;
  background: linear-gradient(135deg, #666, #999) !important;
}

/* SUBJECT SELECTION */
.subject-grid {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: flex-start;
  gap: 14px;
  margin-top: 20px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.subject-grid::-webkit-scrollbar {
  height: 6px;
}

.subject-grid::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
}

.subject-grid::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.15);
}

.subject {
  width: 160px;
  height: 160px;
  flex-shrink: 0;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.15);
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(5px);
}

.subject .icon {
  font-size: 52px;
  z-index: 2;
}

.subject span {
  z-index: 2;
}

.subject:hover {
  transform: translateY(-8px) scale(1.05);
  box-shadow: 0 10px 25px rgba(255, 255, 255, 0.3);
  border-color: #4facfe;
}

.maths { background: linear-gradient(135deg, rgba(255, 154, 0, 0.4), rgba(255, 251, 0, 0.4)); }
.science { background: linear-gradient(135deg, rgba(122, 238, 244, 0.4), rgba(79, 105, 254, 0.4)); }
.english { background: linear-gradient(135deg, rgba(248, 87, 166, 0.4), rgba(255, 88, 88, 0.4)); }
.social { background: linear-gradient(135deg, rgba(67, 233, 123, 0.4), rgba(56, 249, 214, 0.4)); }
.tamil { background: linear-gradient(135deg, rgba(229, 69, 117, 0.4), rgba(254, 225, 64, 0.4)); }

/* CUSTOM PDF BUTTON */
.custom-pdf-container {
  margin-top: 40px;
  text-align: center;
  border-top: 2px solid rgba(255, 255, 255, 0.2);
  padding-top: 30px;
}

.custom-pdf-btn {
  background: linear-gradient(135deg, #FF6B6B, #FF8E53) !important;
  font-size: 18px;
  padding: 18px 30px;
  min-width: 250px;
}

.custom-pdf-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
}

/* LEVEL SELECTION */
.level-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 25px 0;
}

.level-btn {
  min-width: 180px;
  padding: 18px;
  font-size: 18px;
}

/* PROGRESS BAR */
.progress-container {
  width: 100%;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  margin: 25px 0;
  overflow: hidden;
  height: 12px;
  border: 1px solid rgba(255,255,255,0.3);
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #4facfe, #00f2fe, #ff9a00);
  border-radius: 10px;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* QUIZ SECTION */
#timer {
  font-size: 20px;
  text-align: center;
  margin: 15px 0;
  font-weight: bold;
  color: #ff9a00;
  background: rgba(0, 0, 0, 0.5);
  padding: 12px;
  border-radius: 12px;
  border: 2px solid #ff9a00;
  display: inline-block;
  min-width: 120px;
  margin-left: auto;
  margin-right: auto;
  display: block;
}

#question {
  font-size: 22px;
  margin: 25px 0;
  line-height: 1.6;
  text-align: center;
  background: rgba(33, 214, 227, 0.3);
  padding: 20px;
  border-radius: 15px;
  border: 2px solid #4facfe;
}

.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 20px;
}

.options button {
  width: 100%;
  margin: 5px 0;
  text-align: left;
  padding: 16px 20px;
  font-size: 17px;
  border-radius: 12px;
  background: rgba(76, 84, 238, 0.5);
  border: 2px solid transparent;
}

.options button:hover {
  background: rgba(10, 34, 132, 0.8);
  border-color: #4facfe;
}

.correct {
  background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
  border-color: #27ae60 !important;
}

.incorrect {
  background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
  border-color: #c0392b !important;
}

/* MINI GAME CONTAINER */
.game-container {
  height: 550px;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  border: 3px solid #FFD700; /* 8th standard gold accent */
  margin: 20px auto;
  background: linear-gradient(135deg, rgba(8, 18, 64, 0.7), rgba(22, 40, 108, 0.6));
  backdrop-filter: blur(5px);
  padding: 20px;
  width: 100%;
}

.game-instruction {
  font-size: 18px;
  text-align: center;
  margin: 15px 0;
  color: #FFD700; /* 8th standard gold accent */
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

/* GAME ELEMENTS */
.game-element {
  position: absolute;
  cursor: pointer;
  z-index: 10;
  user-select: none;
  transition: transform 0.3s, opacity 0.3s;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
}

.particle {
  position: absolute;
  pointer-events: none;
  font-size: 24px;
  font-weight: bold;
  animation: particleFloat 1s forwards ease-out;
  z-index: 100;
  text-shadow: 0 0 10px white;
}

@keyframes particleFloat {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-60px) scale(1.8); opacity: 0; }
}

/* Memory Match Cards */
.memory-card {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 35px;
  border: 3px solid white;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 10px rgba(0,0,0,0.3);
}

.memory-card.flipped {
  background: linear-gradient(135deg, #FFD700, #FFA500);
}

.memory-card.matched {
  opacity: 0.5;
  cursor: default;
  pointer-events: none;
}

/* Whack-a-Mole */
.whack-mole {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #8B4513, #CD853F);
  border-radius: 50%;
  border: 4px solid #FFD700;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 35px;
  cursor: pointer;
  transition: all 0.2s;
  animation: molePop 0.3s ease-out;
  position: absolute;
}

@keyframes molePop {
  0% { transform: scale(0); }
  80% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.whack-mole:hover {
  transform: scale(1.1);
}

/* Simon Says */
.simon-button {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 45px;
  border: 4px solid white;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 5px 10px rgba(0,0,0,0.3);
}

.simon-button.active {
  transform: scale(1.2);
  filter: brightness(1.5);
  box-shadow: 0 0 20px white;
}

/* Spin Wheel */
.wheel-section {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: conic-gradient(#FF6B6B 0deg 72deg, #4ECDC4 72deg 144deg, #FFD166 144deg 216deg, #06D6A0 216deg 288deg, #118AB2 288deg 360deg);
  border: 10px solid white;
  left: 50%;
  top: 30%;
  transform: translateX(-50%);
  animation: spinWheel 2s ease-out;
  box-shadow: 0 0 30px rgba(255,215,0,0.5);
}

@keyframes spinWheel {
  0% { transform: translateX(-50%) rotate(0deg); }
  100% { transform: translateX(-50%) rotate(1440deg); }
}

.wheel-category {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
  font-size: 18px;
}

/* Option Box */
.option-box {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  padding: 12px 20px;
  border-radius: 50px;
  font-size: 18px;
  text-align: center;
  border: 2px solid white;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  min-width: 150px;
}

.option-box:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(79,172,254,0.5);
}

/* Tamil Question Box */
.tamil-question-box {
  position: absolute;
  left: 50%;
  top: 25%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #FF6B6B, #EE5A52);
  padding: 20px 25px;
  border-radius: 50px;
  border: 3px solid white;
  width: auto;
  max-width: 80%;
  text-align: center;
  font-size: 24px;
  font-family: 'TamilFont', 'Segoe UI', 'Noto Sans Tamil', sans-serif;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  z-index: 20;
  white-space: normal;
  word-wrap: break-word;
  line-height: 1.5;
}

/* Tamil Options Container */
.tamil-options-container {
  position: absolute;
  bottom: 15%;
  left: 5%;
  width: 90%;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  z-index: 20;
  max-height: 200px;
  overflow-y: visible;
}

.tamil-option {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  padding: 12px 20px;
  border-radius: 50px;
  font-size: 20px;
  text-align: center;
  border: 2px solid white;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'TamilFont', 'Segoe UI', 'Noto Sans Tamil', sans-serif;
  min-width: 160px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  flex: 0 1 auto;
  white-space: normal;
  word-wrap: break-word;
}

.tamil-option:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(255,215,0,0.5);
}

/* Treasure Hunt Styles */
.treasure-item {
  position: absolute;
  cursor: pointer;
  font-size: 50px;
  animation: treasureFloat 3s infinite alternate ease-in-out;
  filter: drop-shadow(0 0 15px gold);
  transition: all 0.3s;
}

@keyframes treasureFloat {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-15px) rotate(5deg); }
}

.treasure-item:hover {
  transform: scale(1.2);
  filter: drop-shadow(0 0 20px orange);
}

.treasure-item.found {
  opacity: 0.3;
  filter: grayscale(0.5);
  pointer-events: none;
}

.treasure-map {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(139, 69, 19, 0.8);
  padding: 10px;
  border-radius: 10px;
  border: 2px solid gold;
  font-size: 16px;
  z-index: 30;
}

/* Countdown Timer */
.countdown-timer {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px 20px;
  border-radius: 50px;
  border: 2px solid #ff9a00;
  font-size: 24px;
  font-weight: bold;
  color: #ff9a00;
  z-index: 50;
}

/* PDF Upload Styles */
.pdf-page-range {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  margin: 20px 0;
  border: 2px solid #4facfe;
}

.pdf-range-input {
  display: flex;
  justify-content: center;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.pdf-range-input label {
  font-size: 16px;
  color: #4facfe;
}

.pdf-range-input input {
  padding: 8px 15px;
  border-radius: 8px;
  border: 2px solid #4facfe;
  width: 80px;
  text-align: center;
  font-size: 16px;
  color: black;
  background: white;
}

.pdf-info {
  background: rgba(255,215,0,0.2);
  padding: 10px;
  border-radius: 8px;
  margin: 10px 0;
  font-size: 14px;
  border: 1px solid #FFD700;
}

/* GAME CONTROLS */
.game-controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

/* PDF MODE INDICATOR */
.pdf-mode-indicator {
  text-align: center;
  margin: 10px 0;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  color: #4facfe;
  font-weight: bold;
}

/* COMPLETION SECTION */
#completionMessage {
  font-size: 20px;
  text-align: center;
  margin: 25px 0;
  color: #ff9a00;
  font-weight: bold;
  line-height: 1.6;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

/* Tamil Messages */
.tamil-message {
  font-family: 'TamilFont', 'Segoe UI', 'Noto Sans Tamil', sans-serif;
}

/* PDF Question Display - Clean & Proper */
.pdf-question-item {
  background: rgba(79,172,254,0.15);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  border-left: 5px solid #4facfe;
  font-family: 'TamilFont', 'Segoe UI', 'Noto Sans Tamil', sans-serif;
  line-height: 1.8;
}

.pdf-question-item p {
  margin: 8px 0;
  color: white;
  line-height: 1.8;
}

.pdf-question-item strong {
  color: #FFD700;
  font-size: 18px;
}

.pdf-question-item .options-list {
  color: #4facfe;
  font-weight: 500;
  background: rgba(0,0,0,0.3);
  padding: 8px 12px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 5px;
}

.pdf-question-item .correct-answer {
  color: #2ecc71;
  font-weight: bold;
  background: rgba(46,204,113,0.2);
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-block;
  margin-left: 10px;
}

/* RESPONSIVE DESIGN */
@media (max-width: 768px) {
  h1 { font-size: 2rem; }
  h2 { font-size: 1.5rem; }
 
  .section {
    padding: 20px;
    margin: 15px;
    border-radius: 20px;
  }
 
  .subject-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }
 
  .subject {
    height: 130px;
    font-size: 1rem;
  }
 
  .subject .icon {
    font-size: 40px;
  }
 
  .level-buttons {
    flex-direction: column;
    align-items: center;
  }
 
  .level-btn {
    width: 90%;
  }
 
  .score-display,
  #languageToggle,
  .refresh-btn,
  .season-indicator {
    padding: 8px 16px;
    font-size: 14px;
  }
 
  .game-container {
    height: 500px;
  }
 
  .game-element {
    font-size: 30px;
  }
 
  .option-box {
    font-size: 14px;
    min-width: 120px;
  }
 
  .tamil-question-box {
    font-size: 20px;
    padding: 15px 20px;
    max-width: 90%;
  }
 
  .tamil-option {
    font-size: 16px;
    min-width: 140px;
    padding: 10px 15px;
  }

function selectLevel(level) {
  currentLevel = level;
  currentQuestionIndex = 0;
  gameScore = 0;
  timeLimit = level === 'easy' ? 15 : level === 'medium' ? 15 : 10;
 
  showScreen('progressSection');
 
  const levelTitle = gameLanguage === 'tamil'
    ? `${currentSubject === 'Maths' ? 'கணிதம்' : currentSubject === 'Science' ? 'அறிவியல்' : currentSubject === 'English' ? 'ஆங்கிலம்' : currentSubject === 'Social' ? 'சமூகம்' : 'தமிழ்'} - ${level === 'easy' ? 'ஆரம்ப நிலை' : level === 'medium' ? 'இடைநிலை' : 'மேம்பட்ட நிலை'}`
    : `${currentSubject} - ${level.toUpperCase()} Level`;
   
  document.getElementById('levelTitle').textContent = levelTitle;
 
  const questionCount = questions[currentSubject][level].length;
  document.getElementById('questionCount').textContent =
    gameLanguage === 'tamil'
      ? `${questionCount} கேள்விகளுக்கு தயாராகுங்கள்!`
      : `Get ready for ${questionCount} questions!`;
 
  let progress = 0;
  const progressBar = document.getElementById('progressBar');
  progressBar.style.width = '0%';
 
  const progressInterval = setInterval(() => {
    progress += 2;
    progressBar.style.width = `${Math.min(progress, 100)}%`;
    if (progress >= 100) {
      clearInterval(progressInterval);
      setTimeout(startQuiz, 500);
    }
  }, 30);
}

// ==================== QUIZ FUNCTIONS ====================
function startQuiz() {
  showScreen('quizSection');
 
  const quizTitle = gameLanguage === 'tamil'
    ? `${currentSubject === 'Maths' ? 'கணிதம்' : currentSubject === 'Science' ? 'அறிவியல்' : currentSubject === 'English' ? 'ஆங்கிலம்' : currentSubject === 'Social' ? 'சமூகம்' : 'தமிழ்'} - ${currentLevel === 'easy' ? 'ஆரம்ப நிலை' : currentLevel === 'medium' ? 'இடைநிலை' : 'மேம்பட்ட நிலை'}`
    : `${currentSubject} - ${currentLevel.toUpperCase()} Level`;
   
  document.getElementById('quizTitle').textContent = quizTitle;
  loadQuestion();
  startTimer();
}

function loadQuestion() {
  const questionData = questions[currentSubject][currentLevel][currentQuestionIndex];
  if (!questionData) {
    finishQuiz();
    return;
  }
 
  document.getElementById('question').textContent = questionData.q;
 
  const totalQuestions = questions[currentSubject][currentLevel].length;
  document.getElementById('questionCount').textContent =
    gameLanguage === 'tamil'
      ? `கேள்வி ${currentQuestionIndex + 1}/${totalQuestions}`
      : `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
 
  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = '';
 
  questionData.o.forEach((option, index) => {
    const button = document.createElement('button');
    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
    button.onclick = () => checkAnswer(index, questionData.a);
    optionsContainer.appendChild(button);
  });
}

function startTimer() {
  let timeLeft = timeLimit;
  document.getElementById('timer').textContent = `⏱ ${timeLeft}s`;
 
  clearInterval(gameTimer);
  gameTimer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = `⏱ ${timeLeft}s`;
   
    if (timeLeft <= 5) {
      document.getElementById('timer').style.color = '#ff6b6b';
    }
   
    if (timeLeft <= 0) {
      clearInterval(gameTimer);
      nextQuestion();
    }
  }, 1000);
}

function checkAnswer(selectedIndex, correctIndex) {
  clearInterval(gameTimer);
 
  const buttons = document.querySelectorAll('#optionsContainer button');
  buttons.forEach(btn => btn.disabled = true);
 
  if (selectedIndex === correctIndex) {
    buttons[selectedIndex].classList.add('correct');
    player.score += 10;
    gameScore += 10;
    updateScoreDisplay();
    savePlayerData();
    document.getElementById('timer').textContent = gameLanguage === 'tamil' ? '✅ சரியான விடை! +10' : '✅ Correct! +10';
    document.getElementById('timer').style.color = '#2ecc71';
  } else {
    buttons[selectedIndex].classList.add('incorrect');
    buttons[correctIndex].classList.add('correct');
    document.getElementById('timer').textContent = gameLanguage === 'tamil' ? '❌ முயற்சி செய்!' : '❌ Try Again!';
    document.getElementById('timer').style.color = '#e74c3c';
  }
 
  setTimeout(nextQuestion, 1500);
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < questions[currentSubject][currentLevel].length) {
    document.getElementById('timer').style.color = '#ff9a00';
    loadQuestion();
    startTimer();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  if (!player.levelProgress[currentSubject]) {
    player.levelProgress[currentSubject] = { easy: false, medium: false, hard: false };
  }
  player.levelProgress[currentSubject][currentLevel] = true;
  savePlayerData();
  startSubjectMiniGame();
}

// ==================== LEVEL 1 - EASY: FRUIT CATCHER GAME ====================
function startFruitCatcherGame() {
  const gameArea = document.getElementById('gameArea');
  const totalFruits = 15;
  let caughtCount = 0;
 
  const instruction = gameLanguage === 'tamil'
    ? `🍎 ${pdfSubjectName || 'PDF'} - பழங்களை பிடியுங்கள்! ${totalFruits} பழங்கள்`
    : `🍎 ${pdfSubjectName || 'PDF'} - Catch the Fruits! ${totalFruits} Fruits`;
  document.getElementById('gameInstruction').textContent = instruction;
 
  let basket = null;
  let gameRunning = true;
 
  basket = document.createElement('div');
  basket.className = 'game-element';
  basket.textContent = '🧺';
  basket.style.left = '45%';
  basket.style.bottom = '20px';
  basket.style.fontSize = '60px';
  basket.style.cursor = 'grab';
  basket.style.zIndex = '50';
  basket.style.filter = 'drop-shadow(0 5px 10px rgba(0,0,0,0.3))';
  gameArea.appendChild(basket);
 
  gameArea.addEventListener('mousemove', (e) => {
    if (!gameRunning) return;
    const rect = gameArea.getBoundingClientRect();
    let x = e.clientX - rect.left;
    x = Math.max(30, Math.min(x, rect.width - 70));
    basket.style.left = (x / rect.width * 100) + '%';
  });
 
  gameArea.addEventListener('touchmove', (e) => {
    if (!gameRunning) return;
    e.preventDefault();
    const rect = gameArea.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left;
    x = Math.max(30, Math.min(x, rect.width - 70));
    basket.style.left = (x / rect.width * 100) + '%';
  });
 
  function createFruit() {
    if (!gameRunning || caughtCount >= totalFruits) return;
   
    const fruitsList = ['🍎', '🍌', '🍊', '🍒', '🥝', '🍓', '🍉', '🍑'];
    const fruit = document.createElement('div');
    fruit.className = 'game-element';
    fruit.textContent = fruitsList[Math.floor(Math.random() * fruitsList.length)];
    fruit.style.left = Math.random() * 85 + 5 + '%';
    fruit.style.top = '-5%';
    fruit.style.fontSize = '50px';
    fruit.style.filter = 'drop-shadow(0 5px 10px rgba(0,0,0,0.3))';
    fruit.style.cursor = 'pointer';
   
    let posY = -5;
    const fallSpeed = 0.5 + Math.random();
   
    const fallInterval = setInterval(() => {
      if (!gameRunning || caughtCount >= totalFruits) {
        clearInterval(fallInterval);
        if (fruit.parentNode) fruit.remove();
        return;
      }
     
      posY += fallSpeed;
      fruit.style.top = posY + '%';
     
      const basketRect = basket.getBoundingClientRect();
      const fruitRect = fruit.getBoundingClientRect();
     
      if (fruitRect.bottom >= basketRect.top - 20 &&
          fruitRect.bottom <= basketRect.bottom + 20 &&
          fruitRect.left > basketRect.left - 40 &&
          fruitRect.right < basketRect.right + 40) {
       
        clearInterval(fallInterval);
        fruit.remove();
       
        caughtCount++;
        player.score += 5;
        gameScore += 5;
        updateScoreDisplay();
        savePlayerData();
       
        const plus = document.createElement('div');
        plus.className = 'game-element';
        plus.textContent = '+5 🍎';
        plus.style.left = fruit.style.left;
        plus.style.top = (posY - 5) + '%';
        plus.style.fontSize = '30px';
        plus.style.color = '#FFD700';
        plus.style.animation = 'particleFloat 0.8s forwards';
        plus.style.pointerEvents = 'none';
        gameArea.appendChild(plus);
        setTimeout(() => plus.remove(), 800);
       
        basket.style.transform = 'scale(1.1)';
        setTimeout(() => basket.style.transform = 'scale(1)', 100);
       
        document.getElementById('gameInstruction').textContent =
          gameLanguage === 'tamil'
            ? `🍎 பிடித்தவை: ${caughtCount}/${totalFruits} பழங்கள்`
            : `🍎 Caught: ${caughtCount}/${totalFruits} fruits`;
       
        if (caughtCount >= totalFruits) {
          gameRunning = false;
          setTimeout(() => {
            gameArea.innerHTML = '';
            for (let i = 0; i < 70; i++) {
              setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.textContent = ['🍎', '🍌', '🍊', '🎉', '✨', '🏆'][Math.floor(Math.random() * 6)];
                confetti.style.position = 'absolute';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 100 + '%';
                confetti.style.fontSize = (30 + Math.random() * 40) + 'px';
                confetti.style.animation = 'particleFloat 2s forwards';
                confetti.style.pointerEvents = 'none';
                gameArea.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
              }, i * 40);
            }
            document.getElementById('continueBtn').disabled = false;
            player.score += 50;
            gameScore += 50;
            updateScoreDisplay();
            savePlayerData();
            document.getElementById('gameInstruction').textContent =
              gameLanguage === 'tamil'
                ? '🎉 வாழ்த்துக்கள்! எல்லா பழங்களையும் பிடிச்சிட்டீங்க! +50 புள்ளிகள்'
                : '🎉 Congratulations! You caught all fruits! +50 points';
            const trophy = document.createElement('div');
            trophy.style.position = 'absolute';
            trophy.style.top = '40%';
            trophy.style.left = '50%';
            trophy.style.transform = 'translateX(-50%)';
            trophy.style.fontSize = '100px';
            trophy.textContent = '🏆';
            trophy.style.animation = 'treasureFloat 0.5s infinite alternate';
            gameArea.appendChild(trophy);
          }, 500);
        }
      }
     
      if (posY >= 95) {
        clearInterval(fallInterval);
        fruit.remove();
      }
    }, 50);
   
    gameArea.appendChild(fruit);
  }
 
  const fruitInterval = setInterval(() => {
    if (gameRunning && caughtCount < totalFruits) {
      createFruit();
    }
  }, 700);
 
  setTimeout(() => {
    clearInterval(fruitInterval);
  }, totalFruits * 1500);
}

      document.getElementById('pdfEndPage').max = pdfTotalPages;
      document.getElementById('pdfEndPage').value = pdfTotalPages;

    }

async function uploadPDF() {
  const pdfInput = document.getElementById('pdfUpload');
  const statusDiv = document.getElementById('pdfStatus');
  const generatedDiv = document.getElementById('generatedQuestions');
  const startPage = parseInt(document.getElementById('pdfStartPage').value) || 1;
  const endPage = parseInt(document.getElementById('pdfEndPage').value) || pdfTotalPages;
 
  if (!pdfInput.files[0]) {
    statusDiv.textContent = '❌ Please select a PDF file';
    return;
  }
 
  if (startPage < 1 || endPage > pdfTotalPages || startPage > endPage) {
    statusDiv.textContent = '❌ Invalid page range. Please check your inputs.';
    return;
  }
 
  statusDiv.textContent = '⏳ Processing PDF...';
  generatedDiv.innerHTML = '';
 
  const file = pdfInput.files[0];
  const reader = new FileReader();
 
  reader.onload = async (e) => {
    try {
      const pdf = await pdfjsLib.getDocument(e.target.result).promise;
      let allText = '';
      for (let i = startPage; i <= endPage; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        // Preserve original text exactly as it appears
        allText += textContent.items.map(item => item.str).join(' ') + ' ';
      }
      statusDiv.textContent = '✅ PDF processed! Generating questions...';
     
      let generatedQuestions;
      if (gameLanguage === 'tamil') {
        generatedQuestions = generateTamilSmartQuestions(allText, 10);
      } else {
        generatedQuestions = generateSmartQuestions(allText, 10);
      }
     
      displayGeneratedQuestions(generatedQuestions, startPage, endPage);
    } catch (err) {
      statusDiv.textContent = '❌ Error processing PDF: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

// ==================== CLEAN TAMIL QUESTION GENERATOR - MAKES SENSE! ====================
function generateTamilSmartQuestions(text, maxQuestions = 10) {
  // First, clean the text - preserve Tamil characters
  text = text.replace(/\s+/g, ' ').trim();
 
  // Split into sentences - keep Tamil sentences intact
  const sentences = text.split(/[.!?।॥\n]+/g).filter(s => {
    const trimmed = s.trim();
    return trimmed.length > 15 && trimmed.length < 200 && !trimmed.match(/^\d+$/);
  });
 
  const questions = [];
 
  // Common Tamil stop words to avoid using as answer
  const stopWords = [
    'என்று', 'என்பது', 'இது', 'அது', 'உள்ளது', 'ஆகிய', 'ஆகும்', 'என', 'என்ற',
    'என்கிற', 'என்பதை', 'என்பதற்கு', 'என்பதால்', 'மிகவும்', 'ஒரு', 'இந்த', 'அந்த',
    'எல்லாம்', 'எல்லா', 'அனைத்து', 'சில', 'பல', 'எப்போது', 'எங்கே', 'எப்படி', 'ஏன்'
  ];
 
  for (let s of sentences) {
    if (questions.length >= maxQuestions) break;
   
    let sentence = s.trim();
    if (sentence.length < 20) continue;
   
    // Clean sentence - remove extra spaces
    sentence = sentence.replace(/\s+/g, ' ').trim();
   
    // Extract meaningful Tamil words (remove punctuation)
    const words = sentence.split(' ').filter(w => {
      const cleanWord = w.replace(/[^\u0B80-\u0BFF]/g, '');
      return cleanWord.length > 2 &&
             !stopWords.includes(cleanWord) &&
             !w.match(/^\d+$/) &&
             !w.includes('http') &&
             !w.includes('www') &&
             !w.includes('_____');
    });
   
    if (words.length < 3) continue;
   
    // Pick a meaningful word for the blank (prefer longer words)
    let answerIndex = 0;
    let answerWord = words[0];
   
    for (let i = 0; i < words.length; i++) {
      const cleanWord = words[i].replace(/[^\u0B80-\u0BFF]/g, '');
      if (cleanWord.length > 3 && !stopWords.includes(cleanWord)) {
        answerIndex = i;
        answerWord = words[i];
        break;
      }
    }
   
    // Create question with blank (using _____ for clarity)
    const questionText = sentence.replace(new RegExp(answerWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), '__________');
   
    // Get wrong options from other words
    let wrongOptions = words.filter((w, i) => i !== answerIndex && w !== answerWord);
    wrongOptions = [...new Set(wrongOptions)];
   
    // Tamil meaningful words for fallback (common Tamil words)
    const meaningfulTamilWords = [
      'தமிழ்', 'பாடம்', 'புத்தகம்', 'மாணவர்', 'ஆசிரியர்', 'பள்ளி', 'கல்வி',
      'அறிவியல்', 'கணிதம்', 'வரலாறு', 'புவியியல்', 'இலக்கியம்', 'இலக்கணம்',
      'மொழி', 'எழுத்து', 'சொல்', 'பொருள்', 'விளக்கம்', 'எடுத்துக்காட்டு',
      'முறை', 'விதி', 'கோட்பாடு', 'உண்மை', 'கருத்து', 'கொள்கை', 'மரபு'
    ];
   
    while (wrongOptions.length < 3) {
      const randomWord = meaningfulTamilWords[Math.floor(Math.random() * meaningfulTamilWords.length)];
      if (!wrongOptions.includes(randomWord) && randomWord !== answerWord) {
        wrongOptions.push(randomWord);
      }
    }
   
    // Create options with proper formatting
    const options = [answerWord, ...wrongOptions.slice(0, 3)];
   
    // Shuffle options
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
   
    const correctIndex = options.indexOf(answerWord);
   
    // Clean the question text
    const cleanQuestion = questionText.replace(/\s+/g, ' ').trim();
   
    questions.push({
      q: cleanQuestion,
      o: options,
      a: correctIndex
    });
  }
 
  // If not enough questions, add meaningful default Tamil questions
  if (questions.length < 3) {
    const defaultQuestions = [
      { q: "திருக்குறள் எத்தனை அதிகாரங்களைக் கொண்டது?", o: ["133", "108", "120", "150"], a: 0 },
      { q: "தமிழ் எழுத்துக்கள் மொத்தம் எத்தனை?", o: ["247", "248", "249", "250"], a: 0 },
      { q: "சங்க இலக்கியங்களின் எண்ணிக்கை எத்தனை?", o: ["2281", "2381", "2481", "2581"], a: 0 },
      { q: "திருக்குறள் இயற்றியவர் யார்?", o: ["திருவள்ளுவர்", "அவ்வையார்", "கம்பர்", "இளங்கோவடிகள்"], a: 0 },
      { q: "தமிழ்நாட்டின் மாநிலப் பறவை எது?", o: ["மயில்", "குயில்", "கிளி", "புறா"], a: 0 }
    ];
    for (let i = 0; i < defaultQuestions.length && questions.length < maxQuestions; i++) {
      questions.push(defaultQuestions[i]);
    }
  }
 
  return questions.slice(0, maxQuestions);
}

function generateSmartQuestions(text, maxQuestions = 10) {
  text = text.replace(/\s+/g, ' ').trim();
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
  const questions = [];
  const commonWords = ['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'is', 'are', 'was', 'were', 'have', 'has', 'had', 'be', 'been', 'this', 'that', 'these', 'those', 'it', 'its', 'they', 'them', 'their', 'we', 'us', 'our'];
 
  for (let s of sentences) {
    if (questions.length >= maxQuestions) break;
    const sentence = s.trim();
    if (sentence.length < 20 || sentence.length > 150) continue;
    const words = sentence.split(' ').filter(w => w.length > 3 && !commonWords.includes(w.toLowerCase()) && !w.includes('_') && !w.match(/^\d+$/));
    if (words.length < 4) continue;
    const answerIndex = Math.floor(Math.random() * words.length);
    const answerWord = words[answerIndex];
    const questionText = sentence.replace(new RegExp(answerWord, 'i'), '_____');
    let wrongOptions = words.filter((w, i) => i !== answerIndex && w !== answerWord);
    wrongOptions = [...new Set(wrongOptions)];
    const commonNouns = ['teacher', 'student', 'school', 'book', 'lesson', 'chapter', 'page', 'question', 'answer', 'example', 'problem', 'solution', 'method', 'theory', 'practice', 'knowledge', 'learning', 'education', 'study', 'class', 'subject', 'science', 'math', 'history', 'language'];
    while (wrongOptions.length < 3) {
      const randomNoun = commonNouns[Math.floor(Math.random() * commonNouns.length)];
      if (!wrongOptions.includes(randomNoun) && randomNoun !== answerWord) {
        wrongOptions.push(randomNoun);
      }
    }
    const options = [answerWord, ...wrongOptions.slice(0, 3)];
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    const correctIndex = options.indexOf(answerWord);
    questions.push({ q: questionText, o: options, a: correctIndex });
  }
  return questions.slice(0, maxQuestions);
}

function submitGeneratedQuestions(qs) {
  const subjectName = document.getElementById('pdfSubjectName').value.trim();
  if (!subjectName) {
    alert('❌ Please enter a subject name');
    return;
  }
 
  pdfGeneratedQuestions = qs;
  pdfSubjectName = subjectName;
  pdfQuestionsForGame = qs.map(q => ({ question: q.q, options: q.o, correct: q.o[q.a] }));
 
  if (!questions[subjectName]) {
    questions[subjectName] = {};
  }
 
  const totalQs = qs.length;
  const easyCount = Math.ceil(totalQs * 0.4);
  const mediumCount = Math.ceil(totalQs * 0.3);
  const shuffled = [...qs].sort(() => Math.random() - 0.5);
 
  questions[subjectName].easy = shuffled.slice(0, easyCount);
  questions[subjectName].medium = shuffled.slice(easyCount, easyCount + mediumCount);
  questions[subjectName].hard = shuffled.slice(easyCount + mediumCount);
 
  if (!player.levelProgress[subjectName]) {
    player.levelProgress[subjectName] = { easy: false, medium: false, hard: false };
  }
 
  const subjectContainer = document.querySelector('.subject-grid');
  let existingBtn = document.querySelector(`.subject[data-subject="${subjectName}"]`);
 
  if (!existingBtn) {
    const btn = document.createElement('div');
    btn.className = 'subject';
    btn.setAttribute('data-subject', subjectName);
    btn.innerHTML = `<div class="icon">📚</div><span class="subject-name">${subjectName}</span>`;
    btn.style.cursor = 'pointer';
    btn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
    btn.addEventListener('click', function() {
      currentSubject = this.dataset.subject;
      playSubjectMusic(currentSubject);
      document.getElementById('levelSelectionTitle').textContent =
        gameLanguage === 'tamil' ? `நிலை தேர்ந்தெடுக்கவும் - ${subjectName}` : `Select Level - ${subjectName}`;
      showScreen('levelSection');
      updateLevelButtons();
    });
    subjectContainer.appendChild(btn);
  }
 
  showScreen('subjectSection');
 
  alert(gameLanguage === 'tamil'
    ? `✅ ${qs.length} தரமான கேள்விகள் சேர்க்கப்பட்டன! "${subjectName}" பாடத்தைத் தேர்ந்தெடுக்கவும்.`
    : `✅ ${qs.length} quality questions added! Select "${subjectName}" to start.`);
}

function startMathsMemoryGame() {
  const gameArea = document.getElementById('gameArea');
  const images = ['🍎', '🚗', '🐕', '🐱', '🌞', '⭐', '🦁', '🐘'];
  const cards = [];
 
  images.forEach((img, index) => {
    cards.push({ id: index, img: img, matched: false });
    cards.push({ id: index, img: img, matched: false });
  });
 
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
 
  let flippedCards = [];
  let lockBoard = false;
  let matchedCount = 0;
  const totalPairs = images.length;
 
  const instruction = gameLanguage === 'tamil'
    ? '🧠 ஜோடிகளை பொருத்தவும்! 8 ஜோடிகள்'
    : '🧠 Match the pairs! 8 pairs';
  document.getElementById('gameInstruction').textContent = instruction;
 
  const gridSize = 4;
  const cardWidth = 70;
  const startX = (gameArea.offsetWidth - (gridSize * cardWidth + (gridSize - 1) * 10)) / 2;
  const startY = 80;
 
  cards.forEach((card, index) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'game-element memory-card';
    cardEl.style.left = startX + (index % gridSize) * (cardWidth + 10) + 'px';
    cardEl.style.top = startY + Math.floor(index / gridSize) * (cardWidth + 10) + 'px';
    cardEl.style.width = cardWidth + 'px';
    cardEl.style.height = cardWidth + 'px';
    cardEl.textContent = '?';
    cardEl.dataset.id = card.id;
    cardEl.dataset.img = card.img;
    cardEl.dataset.matched = 'false';
   
    cardEl.onclick = function() {
      if (lockBoard) return;
      if (this.dataset.matched === 'true') return;
      if (flippedCards.includes(this)) return;
      if (flippedCards.length >= 2) return;
     
      this.textContent = this.dataset.img;
      this.style.background = 'linear-gradient(135deg, #FFD700, #FFA500)';
      flippedCards.push(this);
     
      if (flippedCards.length === 2) {
        lockBoard = true;
       
        if (flippedCards[0].dataset.id === flippedCards[1].dataset.id) {
          setTimeout(() => {
            flippedCards[0].style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
            flippedCards[1].style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
            flippedCards[0].dataset.matched = 'true';
            flippedCards[1].dataset.matched = 'true';
            matchedCount++;
           
            player.score += 10;
            gameScore += 10;
            updateScoreDisplay();
            savePlayerData();
           
            createParticle(flippedCards[0], '+10', '#2ecc71');
           
            flippedCards = [];
            lockBoard = false;
           
            if (matchedCount === totalPairs) {
              document.getElementById('continueBtn').disabled = false;
              player.score += 30;
              gameScore += 30;
              updateScoreDisplay();
              savePlayerData();
              document.getElementById('gameInstruction').textContent = gameLanguage === 'tamil'
                ? '🎉 அருமை! விளையாட்டு முடிந்தது! +30 புள்ளிகள்'
                : '🎉 Great! Game Complete! +30 points';
            }
          }, 500);
        } else {
          setTimeout(() => {
            flippedCards[0].textContent = '?';
            flippedCards[1].textContent = '?';
            flippedCards[0].style.background = 'linear-gradient(135deg, #4facfe, #00f2fe)';
            flippedCards[1].style.background = 'linear-gradient(135deg, #4facfe, #00f2fe)';
            flippedCards = [];
            lockBoard = false;
          }, 1000);
        }
      }
    };
   
    gameArea.appendChild(cardEl);
  });
}

      { q: 'முயன்றால் முடியாதது ஒன்றுமில்லை - இதன் பொருள்?', options: ['முயற்சி தேவையில்லை', 'முயற்சி செய்தால் வெற்றி கிடைக்கும்', 'முயற்சி கடினம்', 'வெற்றி எளிது'], a: 'முயற்சி செய்தால் வெற்றி கிடைக்கும்' }
    ],
    'விடுகதை': [
      { q: 'என்னை எல்லாரும் கேட்கிறார்கள், ஆனால் யாரும் பார்க்க முடியாது. நான் யார்?', options: ['காற்று 💨', 'சத்தம் 🔊', 'ஒளி 💡', 'நிழல் 👤'], a: 'சத்தம் 🔊' },
      { q: 'என்னை வெட்டினால் நான் பெரியவனாகிறேன். நான் யார்?', options: ['மரம் 🌳', 'குழி 🕳️', 'காய்கறி 🥕', 'பழம் 🍎'], a: 'குழி 🕳️' },
      { q: 'நான் எப்போதும் முன்னால் போவேன், ஆனால் ஒருபோதும் பின்னால் வர மாட்டேன். நான் யார்?', options: ['கார் 🚗', 'நேரம் ⏰', 'நதி 🌊', 'காற்று 💨'], a: 'நேரம் ⏰' },
      { q: 'ஒரு தந்தைக்கு 4 மகன்கள். ஒவ்வொரு மகனுக்கும் ஒரு சகோதரி இருக்கிறாள். மொத்தம் எத்தனை குழந்தைகள்?', options: ['4', '5', '6', '7'], a: '5' },
      { q: 'ஒரு மனிதன் மழையில் நனைந்தும், முடி நனைக்கவில்லை. ஏன்?', options: ['குடை வைத்திருந்தார் ☂️', 'முடி இல்லாதவர் 👨‍🦲', 'வீட்டில் இருந்தார் 🏠', 'காரில் இருந்தார் 🚗'], a: 'முடி இல்லாதவர் 👨‍🦲' }
    ],
    'எதிர்ச்சொல்': [
      { q: '"பெரிய" - இதன் எதிர்ச்சொல்?', options: ['சிறிய', 'நீண்ட', 'குட்டையான', 'அகலமான'], a: 'சிறிய' },
      { q: '"நல்ல" - இதன் எதிர்ச்சொல்?', options: ['கெட்ட', 'மோசமான', 'தீய', 'அழகான'], a: 'கெட்ட' },
      { q: '"வெப்பம்" - இதன் எதிர்ச்சொல்?', options: ['குளிர்ச்சி', 'சூடு', 'உஷ்ணம்', 'பனி'], a: 'குளிர்ச்சி' },
      { q: '"ஒளி" - இதன் எதிர்ச்சொல்?', options: ['இருட்டு', 'நிழல்', 'கண்', 'வெளிச்சம்'], a: 'இருட்டு' },
      { q: '"மேல்" - இதன் எதிர்ச்சொல்?', options: ['கீழ்', 'அடி', 'தாழ', 'பக்கம்'], a: 'கீழ்' }
    ],
    'பொருள்': [
      { q: '"அமைதி" - இதன் ஆங்கிலப் பொருள்?', options: ['Peace', 'War', 'Love', 'Hate'], a: 'Peace' },
      { q: '"சந்தோஷம்" - இதன் ஆங்கிலப் பொருள்?', options: ['Sadness', 'Happiness', 'Anger', 'Fear'], a: 'Happiness' },
      { q: '"தாய்" - இதன் ஆங்கிலப் பொருள்?', options: ['Father', 'Mother', 'Brother', 'Sister'], a: 'Mother' },
      { q: '"நண்பன்" - இதன் ஆங்கிலப் பொருள்?', options: ['Enemy', 'Friend', 'Teacher', 'Student'], a: 'Friend' },
      { q: '"புத்தகம்" - இதன் ஆங்கிலப் பொருள்?', options: ['Pen', 'Book', 'Paper', 'Pencil'], a: 'Book' }
    ],
    'விடுபட்ட சொல்': [
      { q: '"கற்றது கைமண் ____" - விடுபட்ட சொல்?', options: ['அளவு', 'பெரிது', 'சிறிது', 'உயர்வு'], a: 'அளவு' },
      { q: '"ஆற அமர ____" - விடுபட்ட சொல்?', options: ['சிந்தி', 'ஓடு', 'பேசு', 'விளையாடு'], a: 'சிந்தி' },
      { q: '"காலம் ____ போன்றது" - விடுபட்ட சொல்?', options: ['பொன்', 'மண்', 'கல்', 'மரம்'], a: 'பொன்' },
      { q: '"உழைப்பே உயர்வு ____" - விடுபட்ட சொல்?', options: ['தரும்', 'ஆகும்', 'போகும்', 'வரும்'], a: 'தரும்' },
      { q: '"முயன்றால் முடியாதது ____" - விடுபட்ட சொல்?', options: ['ஒன்றுமில்லை', 'எல்லாம்', 'ஏதோ', 'பல'], a: 'ஒன்றுமில்லை' }
    ]
  };
 
  let spinDone = false;
  let currentQuestions = [];
  let currentQIndex = 0;
  let selectedCategory = '';
 
  document.getElementById('gameInstruction').textContent = '🎡 சில்லினைச் சுழற்றவும்! 5 வினாடிகள் காத்திருக்கவும்';
 
  const wheel = document.createElement('div');
  wheel.className = 'wheel-section';
  wheel.style.animation = 'none';
  gameArea.appendChild(wheel);
 
  categories.forEach((cat, index) => {
    const angle = index * 72;
    const label = document.createElement('div');
    label.className = 'wheel-category';
    label.style.transform = `rotate(${angle}deg) translate(0, -80px) rotate(-${angle}deg)`;
    label.textContent = cat;
    wheel.appendChild(label);
  });
 
  const spinBtn = document.createElement('button');
  spinBtn.textContent = '🎡 சுழற்று';
  spinBtn.style.position = 'absolute';
  spinBtn.style.left = '50%';
  spinBtn.style.transform = 'translateX(-50%)';
  spinBtn.style.top = '70%';
  spinBtn.style.padding = '15px 30px';
  spinBtn.style.fontSize = '20px';
  spinBtn.style.background = 'linear-gradient(135deg, #FFD700, #FFA500)';
  spinBtn.style.border = 'none';
  spinBtn.style.borderRadius = '50px';
  spinBtn.style.color = 'white';
  spinBtn.style.cursor = 'pointer';
  spinBtn.style.zIndex = '20';
 
  const countdownDisplay = document.createElement('div');
  countdownDisplay.className = 'countdown-timer';
  countdownDisplay.style.display = 'none';
  gameArea.appendChild(countdownDisplay);
 
  spinBtn.onclick = function() {
    if (spinDone) return;
    spinDone = true;
    spinBtn.disabled = true;
    wheel.style.animation = 'spinWheel 2s ease-out';
   
    countdownDisplay.style.display = 'block';
    let countdown = 5;
    countdownDisplay.textContent = `⏱ ${countdown}s`;
    const countdownInterval = setInterval(() => {
      countdown--;
      countdownDisplay.textContent = `⏱ ${countdown}s`;
      if (countdown <= 0) {
        clearInterval(countdownInterval);
        countdownDisplay.style.display = 'none';
      }
    }, 1000);
   
    setTimeout(() => {
      wheel.style.animation = 'none';
      const randomIndex = Math.floor(Math.random() * categories.length);
      selectedCategory = categories[randomIndex];
      document.getElementById('gameInstruction').textContent = `🎡 சில்லு நின்றது: ${selectedCategory} - 5 கேள்விகள்`;
      const allQuestions = questionBank[selectedCategory] || questionBank['பழமொழி'];
      const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
      currentQuestions = shuffled.slice(0, 5);
      currentQIndex = 0;
      spinBtn.remove();
      wheel.remove();
      loadSpinQuestion();
    }, 5000);
  };
  gameArea.appendChild(spinBtn);
 
  function loadSpinQuestion() {
    if (currentQIndex >= currentQuestions.length) {
      document.getElementById('continueBtn').disabled = false;
      player.score += 50;
      gameScore += 50;
      updateScoreDisplay();
      savePlayerData();
      document.getElementById('gameInstruction').textContent = '🎉 சில்லு விளையாட்டு முடிந்தது! +50 புள்ளிகள்';
      gameArea.innerHTML = '<div style="position: absolute; top: 40%; left: 50%; transform: translateX(-50%); font-size: 60px;">🏆</div>';
      return;
    }
    gameArea.innerHTML = '';
    const q = currentQuestions[currentQIndex];
    const questionDisplay = document.createElement('div');
    questionDisplay.className = 'tamil-question-box';
    questionDisplay.textContent = q.q;
    questionDisplay.style.fontSize = '22px';
    questionDisplay.style.maxWidth = '85%';
    gameArea.appendChild(questionDisplay);
    const optionsContainer = document.createElement('div');
    optionsContainer.className = 'tamil-options-container';
    optionsContainer.style.gap = '12px';
    optionsContainer.style.bottom = '10%';
    const options = [...q.options].sort(() => Math.random() - 0.5);
    options.forEach((opt) => {
      const optEl = document.createElement('div');
      optEl.className = 'tamil-option';
      optEl.textContent = opt;
      optEl.style.fontSize = '18px';
      optEl.style.padding = '10px 15px';
      optEl.style.minWidth = '130px';
      optEl.onclick = function() {
        if (this.textContent === q.a) {
          createParticle(this, '✓ +10', '#2ecc71');
          player.score += 10;
          gameScore += 10;
          updateScoreDisplay();
          savePlayerData();
          currentQIndex++;
          document.getElementById('gameInstruction').textContent = `${selectedCategory} - கேள்வி ${currentQIndex + 1}/5`;
          loadSpinQuestion();
        } else {
          createParticle(this, '❌', '#e74c3c');
        }
      };
      optionsContainer.appendChild(optEl);
    });
    gameArea.appendChild(optionsContainer);
  }
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  updateScoreDisplay();
  document.getElementById('pdfModeIndicator').innerHTML = 'English';
});

function hideLogo() {
  document.getElementById("logo").style.display = "none";
}
</script>
